<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script src="JS/login.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <title>Ticket - Hub Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* LEFT SIDE */
        .left {
            width: 52%;
            padding: 70px 8%;
            background: linear-gradient(120deg, #120000, #050505 60%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .ticket {
            font-size: 90px;
            color: #e50914;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
        }

        .logo span {
            color: #e50914;
        }

        .tagline {
            font-size: 24px;
            color: #bbb;
            margin-top: 15px;
        }

        .line {
            width: 75px;
            height: 2px;
            background: red;
            margin: 35px auto;
        }

        .main-text {
            font-size: 30px;
            line-height: 1.5;
        }

        .small-text {
            color: #bbb;
            font-size: 21px;
            margin-top: 15px;
        }

        /* RIGHT SIDE */

        .login-box {
            width: 100%;
            margin: auto;
            max-width: 610px;
            background: #101114;
            border: 1px solid #292b30;
            border-radius: 18px;
            padding: 50px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.05);
        }

        .login-box h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 20px;
            margin-bottom: 45px;
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .input-box {
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 18px;
            background: #151619;
            border: 1px solid #303238;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #e50914;
        }

        .forgot {
            text-align: right;
            margin-top: -15px;
            margin-bottom: 15px;
        }

        .forgot a,
        .signup a {
            color: #e50914;
            text-decoration: none;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .remember input {
            width: 20px;
            height: 20px;
            accent-color: #e50914;
        }

        .login-btn {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 9px;
            background: #e50914;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #c70710;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #999;
            margin: 30px 0;
        }

        .or::before,
        .or::after {
            content: "";
            height: 1px;
            background: #333;
            flex: 1;
        }

        .social-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background: #151619;
            border: 1px solid #303238;
            border-radius: 9px;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .social-btn:hover {
            background: #202125;
        }

        .signup {
            text-align: center;
            color: #aaa;
            font-size: 18px;
            margin-top: 30px;
        }

        /* MOBILE */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 50px 20px;
            }

            .logo {
                font-size: 38px;
            }

            .main-text {
                font-size: 24px;
            }

            .right {
                padding: 20px;
            }

            .login-box {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    
    <!-- LEFT SECTION -->
    <div class="left ">
        
        <div class="ticket">🎟️</div>

        <div class="logo">
            TICKET - <span>HUB</span>
        </div>

        <div class="tagline">
            Your Gateway to Entertainment
        </div>

        <div class="line"></div>

        <div class="main-text">
            Book Movies, Events &<br>
            Experiences with ease.
        </div>

        <div class="small-text">
            Fast. Simple. Secure.
        </div>

    </div>


    <!-- RIGHT SECTION -->

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to continue to Ticket - Hub
            </p>

            <form>

                <div class="input-box">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password">
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <div class="remember">
                    <input type="checkbox" checked>
                    <span>Remember me</span>
                </div>

                <button class="login-btn" type="submit">
                    Login
                </button>

                <div class="or">
                    <span>or continue with</span>
                </div>

                <button class="social-btn" type="button" id="google-btn">
                    <i class="fa-brands fa-google"></i>
                    Continue With Google
                </button>

                <button class="social-btn" type="button">
                    <i class="fa-brands fa-facebook"></i> Continue With Facebook
                </button>

                <button class="social-btn" type="button">
                    <i class="fa-brands fa-apple"></i> Continue With Apple
                </button>

                <div class="signup">
                    Don't have an account?
                    <a href="#">Sign up</a>
                </div>

            </form>

        </div>

</div>

</body>
</html>
